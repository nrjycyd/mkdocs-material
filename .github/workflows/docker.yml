name: Docker Image

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - IMAGE_REVISION
      - Dockerfile
      - .dockerignore
      - requirements.in
      - requirements.txt
      - tools/**
      - tests/**
      - .github/workflows/docker.yml
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - IMAGE_REVISION
      - Dockerfile
      - .dockerignore
      - requirements.in
      - requirements.txt
      - tools/**
      - tests/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

# PR 更新可取消旧验证；main 的发布按顺序完成，避免并发覆盖 latest。
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base: ${{ steps.version.outputs.base }}
      release: ${{ steps.version.outputs.release }}
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Read versions
        id: version
        run: python tools/versions.py >> "$GITHUB_OUTPUT"
      - name: Normalize image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "value=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Check lock matches direct dependencies and base version
        run: |
          python -m pip install uv==0.12.14
          python tools/lock_requirements.py --check
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and verify both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            MKMATERIAL_VERSION=${{ steps.version.outputs.base }}
          cache-from: type=gha,scope=mkdocs-material
          cache-to: type=gha,mode=max,scope=mkdocs-material

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MKMATERIAL_VERSION=${{ needs.verify.outputs.base }}
          tags: |
            ${{ needs.verify.outputs.image }}:latest
            ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.release }}
            ${{ needs.verify.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.release }}
          cache-from: type=gha,scope=mkdocs-material
          cache-to: type=gha,mode=max,scope=mkdocs-material
