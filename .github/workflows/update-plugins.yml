name: Update Plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 要升级的插件（PyMdown 兼容版本单独维护）
        required: true
        type: choice
        options:
          - mkdocs-macros-plugin
          - mkdocs-statistics-plugin
          - mkdocs-glightbox
          - mkdocs-table-reader-plugin
          - markdown-exec
          - mkdocs-markmap
          - mkdocs_puml
          - mkdocs-literate-nav
          - mkdocstrings
          - mkdocs-minify-plugin
          - mkdocs-git-revision-date-localized-plugin
          - mkdocs-git-committers-plugin-2
      version:
        description: 目标版本号（只填数字版本，不加 v，例如 1.3.8）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-plugins
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      PLUGIN: ${{ inputs.plugin }}
      PLUGIN_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Install dependency tools
        run: python -m pip install uv==0.12.14 packaging==26.3
      - name: Update the requested plugin pin
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from packaging.version import Version

          def normalize(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          plugin = os.environ["PLUGIN"].strip()
          requested = os.environ["PLUGIN_VERSION"].strip()
          if not re.fullmatch(r"[0-9][0-9A-Za-z.!+-]*", requested):
              raise SystemExit("Enter a Python package version without a v prefix")
          target = Version(requested)
          path = Path("requirements.in")
          lines = path.read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              match = re.fullmatch(r"([A-Za-z0-9_.-]+)(\[[A-Za-z0-9_,.-]+\])?==(.+)", line)
              if match and normalize(match[1]) == normalize(plugin):
                  if target <= Version(match[3]):
                      raise SystemExit(f"Target version must be newer than {match[3]}")
                  lines[index] = f"{match[1]}{match[2] or ''}=={target}"
                  break
          else:
              raise SystemExit(f"Plugin is not declared in requirements.in: {plugin}")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Regenerate and check dependency lock
        run: |
          python tools/lock_requirements.py
          python tools/lock_requirements.py --check
      - name: Increment image revision
        id: version
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from versions import read_versions

          _, revision = read_versions()
          Path("IMAGE_REVISION").write_text(f"{int(revision) + 1}\n", encoding="utf-8")
          PY
          python tools/versions.py >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Verify both architectures before creating the pull request
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            MKMATERIAL_VERSION=${{ steps.version.outputs.base }}
          cache-from: type=gha,scope=mkdocs-material
          cache-to: type=gha,mode=max,scope=mkdocs-material
      - name: Create upgrade pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="automation/plugins-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.in requirements.txt IMAGE_REVISION
          git commit -m "chore: upgrade ${PLUGIN} to ${PLUGIN_VERSION}"
          git push origin "$branch"
          body_file="$RUNNER_TEMP/plugin-upgrade.md"
          cat > "$body_file" <<'BODY'
          Upgrade the selected plugin, regenerate the dependency lock and increment the image revision.

          Validation: both linux/amd64 and linux/arm64 images passed dependency checks and strict documentation smoke builds in the Update Plugins workflow.

          Review and merge this pull request to publish the new image through the Docker Image workflow. If GitHub shows an Approve workflows to run banner, approve the PR verification before merging.

          If another dependency upgrade is merged first, regenerate this update from the latest main so that IMAGE_REVISION remains unique.
          BODY
          pr_url="$(gh pr create --base main --head "$branch" --title "chore: upgrade ${PLUGIN} to ${PLUGIN_VERSION}" --body-file "$body_file")"
          printf 'Upgrade pull request: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
